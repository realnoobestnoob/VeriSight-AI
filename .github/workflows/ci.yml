name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements/torch.txt
          pip install -r requirements/dev.lock.txt
          pip install --no-deps -e .
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Import / config smoke test
        run: |
          python -c "import verisight_ai, verisight_ai.cli, verisight_ai.pipeline"
          python -c "from verisight_ai.config import load_config; load_config('configs/default.yaml')"
      - name: Tests (no GPU, no secrets, no real dataset)
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Create placeholder artifacts dir if no model is committed
        run: mkdir -p model_artifacts && touch model_artifacts/.gitkeep
      - name: Build image
        run: docker build -t verisight-ai:${{ github.sha }} .
      - name: Container startup smoke test (health endpoint)
        run: |
          docker run -d --name vs -p 8501:8501 verisight-ai:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then echo " healthy"; exit 0; fi
            sleep 3
          done
          docker logs vs
          exit 1
